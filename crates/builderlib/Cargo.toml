[package]
name = "nxport-builderlib"
version = "0.1.0"
edition = "2021"

[lib]
name = "nxport_builderlib"
path = "src/lib.rs"

[dependencies]
nxport-enginelib = { path = "../enginelib" }
nxport-metalshaderlib = { path = "../metalshaderlib" }
zstd = "0.13"
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The app icon: the dump's logo (PNG) or the console's icon (JPEG), scaled into a Windows .ico.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
sass2spv = { path = "../sass2spv" }
nxport-lifterlib = { path = "../lifterlib" }
sha2 = "0.10"
ash = "0.38"
nxport-pipelines = { path = "../pipelines" }
