[package]
name = "nxport-builder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nxport-builder"
path = "src/main.rs"

[dependencies]
nxport = { path = "../engine" }
nxport-build = { path = "../build" }
nxport-pipelines = { path = "../pipelines" }
clap = { version = "4.6.7", features = ["derive"] }
struct-patch = "0.14.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

# The window on Windows: Dear ImGui over SDL3 (the engine's settings editor draws into it), on the SDL3.dll the engine
# links against (vendor/SDL3), so nothing is built with CMake (window_sdl.rs).
[target.'cfg(windows)'.dependencies]
dear-imgui-rs = { version = "0.21", features = ["build-from-source"] }
sdl3 = { version = "0.20", default-features = false }

