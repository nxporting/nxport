[package]
name = "nxport-builder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nxport-builder"
path = "src/main.rs"

[dependencies]
nxport = { path = "../engine" }
nxport-build = { path = "../build" }
nxport-pipelines = { path = "../pipelines" }
clap = { version = "4.6.7", features = ["derive"] }
struct-patch = "0.14.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

