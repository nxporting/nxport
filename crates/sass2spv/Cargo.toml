[package]
name = "sass2spv"
version = "0.1.0"
edition = "2021"
# A port of Ryujinx's shader translator (Ryujinx.Graphics.Shader and Spv.Generator); its licence applies, see LICENSE.
license = "MIT"

[lib]
name = "sass2spv"
path = "src/lib.rs"

[[bin]]
name = "sass2spv"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
