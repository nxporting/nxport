[package]
name = "sass2spv"
version = "0.1.0"
edition = "2021"
# A port of Ryujinx's shader translator (Ryujinx.Graphics.Shader and Spv.Generator); its licence applies, see LICENSE.
license = "MIT"

[lib]
name = "sass2spv"
path = "src/lib.rs"

[[bin]]
name = "sass2spv"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The translator's own warnings, silenced here instead of in its sources: its source hash (build.rs) names the shader
# caches, so any edit under src/ drops every cache it wrote. Fix them with the next change to the translator.
[lints.rust]
non_camel_case_types = "allow"
unused_imports = "allow"
unused_mut = "allow"
unused_assignments = "allow"
dead_code = "allow"
