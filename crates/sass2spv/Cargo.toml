[package]
name = "sass2spv"
version = "0.1.0"
edition = "2021"
# A port of Ryujinx's shader translator (Ryujinx.Graphics.Shader); its licence applies, see LICENSE.
license = "MIT"

[lib]
name = "sass2spv"
path = "src/lib.rs"

[[bin]]
name = "sass2spv"
path = "src/main.rs"

[dependencies]
rspirv = "0.12"
spirv = "0.3"
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
rustc-hash = "2"
