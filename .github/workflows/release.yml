# A version tag: builds the builder for Windows and macOS and publishes a GitHub Release with the two archives.
# Run by hand (Actions > Release > Run workflow): the same builds, the archives as run artifacts, no release.
#
# An archive holds tools only. Each job lists exactly what goes in and fails on anything else: no game's files, lifted
# code or caches can come along.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
  # crates/build/src/zig.rs: the version and checksum the builder would download. Beside it, none is downloaded.
  ZIG_NAME: zig-x86_64-windows-0.17.1
  ZIG_VERSION: "0.17.1"
  ZIG_SHA256: b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      # The sources as committed: some are hashed or embedded, so a checkout with CRLF would differ from macOS's.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # The debug output main's CI saved, for the tests and the builder's ios-engine run. Release output is not worth a
      # cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      # See ci.yml: the test programs link SDL3.dll at start. The builder carries its own.
      - run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\vendor\SDL3\lib"
      - name: Test
        run: cargo test --workspace --locked --lib --bins
      - name: Build the builder
        run: cargo build --release --locked -p nxport-builder
      # A release cannot build the iOS engine where it runs (no source): it takes ios/nxport beside the builder, which
      # must come from the same commit, as the engine refuses a guest image patched by other code. The builder only
      # drives the build, so debug will do.
      - name: Build the engine for iOS
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\ld64.lld.exe')) { choco install llvm -y --no-progress }
          cargo run --locked -p nxport-builder -- ios-engine
      - name: Assemble the archive
        shell: bash
        run: |
          root="nxport-builder-$VERSION"
          stage="$RUNNER_TEMP/stage/$root"
          mkdir -p "$stage/ios" dist
          cp target/release/nxport-builder.exe "$stage/"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.zip" "https://ziglang.org/download/$ZIG_VERSION/$ZIG_NAME.zip"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.zip" | sha256sum -c -
          7z x -bd -o"$RUNNER_TEMP/zig-unpacked" "$RUNNER_TEMP/zig.zip" > /dev/null
          mv "$RUNNER_TEMP/zig-unpacked/$ZIG_NAME" "$stage/zig"
          cp target/engines/aarch64-apple-ios/release/nxport "$stage/ios/nxport"
          # The project's licence, and one file of every other notice: the crates', then the two projects these crates derive from.
          cp LICENSE "$stage/"
          perl .github/scripts/notices.pl "$stage/THIRD_PARTY_LICENSES.txt" x86_64-pc-windows-msvc
          .github/scripts/fold-licences.sh "$stage/THIRD_PARTY_LICENSES.txt"
          printf '%s\n' LICENSE THIRD_PARTY_LICENSES.txt ios/nxport nxport-builder.exe \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          (cd "$stage" && find . -type f -not -path './zig/*' | sed 's|^\./||' | LC_ALL=C sort) | diff "$RUNNER_TEMP/expected" -
          test -f "$stage/zig/zig.exe"
          "$stage/nxport-builder.exe" --help
          (cd "$RUNNER_TEMP/stage" && 7z a -tzip -bd "$GITHUB_WORKSPACE/dist/$root-windows-x86_64.zip" "$root")
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
      # An app's nxport.exe is the builder program, so a player's crash report (nxport.exe+offset) is named from the
      # builder's symbols. Kept with the run, not in the archive.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-symbols
          path: target/release/nxport_builder.pdb
          if-no-files-found: error
          retention-days: 90

  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: false
      # nxport-build's build script builds the two engines into target/engines first.
      - name: Build the builder and the engines
        run: cargo build --release --locked -p nxport-builder
      - name: Test
        run: cargo test --locked -p nxport -p nxport-build -p nxport-builder -p nxport-lifter -p nxport-pipelines -p sass2spv --lib --bins
      - name: Assemble the archive
        run: |
          root="nxport-builder-$VERSION"
          stage="$RUNNER_TEMP/stage/$root"
          mkdir -p "$stage/ios" dist
          cp target/release/nxport-builder "$stage/"
          cp target/engines/aarch64-apple-darwin/release/nxport "$stage/nxport"
          cp target/engines/aarch64-apple-ios/release/nxport "$stage/ios/nxport"
          cp LICENSE "$stage/"
          perl .github/scripts/notices.pl "$stage/THIRD_PARTY_LICENSES.txt" aarch64-apple-darwin
          .github/scripts/fold-licences.sh "$stage/THIRD_PARTY_LICENSES.txt"
          printf '%s\n' LICENSE THIRD_PARTY_LICENSES.txt ios/nxport nxport nxport-builder \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          (cd "$stage" && find . -type f | sed 's|^\./||' | LC_ALL=C sort) | diff "$RUNNER_TEMP/expected" -
          "$stage/nxport-builder" --help
          tar -czf "dist/$root-macos-arm64.tar.gz" -C "$RUNNER_TEMP/stage" "$root"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # Windows is required; a macOS failure leaves its archive out and says so, as nobody here can build for a Mac to fix
  # it before a release. This is the only job with write access, and it runs no third-party code.
  publish:
    needs: [windows, macos]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The two archives only (the symbols stay with the run).
      - uses: actions/download-artifact@v8
        with:
          pattern: '{windows,macos}'
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          notes="Windows: unpack and run nxport-builder.exe. macOS: unpack, then run xattr -dr com.apple.quarantine on the folder (not signed or notarized). iOS apps built on Windows have not been run on a device yet."
          if [ "$MACOS_RESULT" != success ]; then
            notes="$notes

          **This release has no macOS build: that job did not succeed.**"
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes "$notes" --generate-notes "${prerelease[@]}" -- *
