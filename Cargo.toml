[workspace]
members = [
    "crates/engine",
    "crates/build",
    "crates/cli",
    "crates/builder",
    "crates/sass2spv",
    "crates/pipelines",
    "crates/lifter",
    "crates/media",
]
# `cargo run` / `cargo build` in the root: the builder (cargo build --workspace for the engine and the command line too).
default-members = ["crates/builder"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release code with symbols, for sampling/profiling (cargo build --profile profiling).
# Probes and diagnostics: no LTO, parallel codegen (minutes faster per build).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"