# ==============================================================================
# [DARWIN KERNEL TRICK - macOS SDK < 13.0 COMPATIBILITY OVERRIDE]
# When Mach-O platform version specifies macOS SDK < 13.0 (e.g. 12.0 / 0xc0000),
# the Apple Silicon XNU kernel (osfmk/arm64/machine_task.c) sets:
#     task->preserve_x18 = true;
# This forces macOS to save/restore physical x18 across all timer preemption
# interrupts and context switches on Darwin, allowing native execution.
# Note: On iOS, XNU strictly enforces platform == PLATFORM_MACOS, so iOS
# requires the static trampoline architecture instead (trampoline.rs, chosen
# automatically from the executable's LC_BUILD_VERSION; a macOS build without
# this flag uses it too, which is how it is tested on the Mac).
# ==============================================================================
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-platform_version,macos,11.0,12.0"]
